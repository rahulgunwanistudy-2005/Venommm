name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # CI must never reach the network: every fetcher has to be satisfiable from the
      # committed derived tables, which is the same guarantee the offline demo relies on.
      VENOMGAP_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: mypy
        run: mypy src
      - name: pytest
        run: pytest -q -m "not network"
      - name: data contracts
        run: python -m venomgap.cli validate-data
      - name: full pipeline, offline
        run: python -m venomgap.cli pipeline
      - name: README is generated, not retyped
        run: python experiments/scripts/build_readme.py --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build
